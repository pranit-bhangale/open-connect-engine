services:
  postgres:
    image: postgres:16-alpine
    container_name: open-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - open-connect-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/open-connect
      dockerfile: Dockerfile
    container_name: open-connect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Connect to Postgres container within the Docker network
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8080:8080"
    volumes:
      - backend_logs:/app/logs
    networks:
      - open-connect-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
    name: open-connect-postgres-data
  backend_logs:
    name: open-connect-backend-logs
networks:
  open-connect-network:
    name: open-connect-network
    driver: bridge
