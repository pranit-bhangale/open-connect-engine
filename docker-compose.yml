services:
  postgres:
    image: postgres:16-alpine
    container_name: open-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chat}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - open-connect-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-chat}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/open-connect
      dockerfile: Dockerfile
    container_name: open-connect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chat}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-140503}
      PORT: 8080
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: "*"
    expose:
      - "8080"
    volumes:
      - backend_logs:/app/logs
    networks:
      - open-connect-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s

  frontend:
    build:
      context: ./frontend/open-connect
      dockerfile: Dockerfile
    container_name: open-connect-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - open-connect-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: open-connect-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    networks:
      - open-connect-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: open-connect-postgres-data
  backend_logs:
    name: open-connect-backend-logs
  nginx_logs:
    name: open-connect-nginx-logs

networks:
  open-connect-network:
    name: open-connect-network
    driver: bridge
