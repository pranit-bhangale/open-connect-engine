spring:
  application:
    name: open-connect
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ChatPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
# Swagger Configuration
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH}
  level:
    root: ${LOG_LEVEL_ROOT}
    com.pranit.connect: ${LOG_LEVEL}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: open-connect
    description: "open-connect."
    version: "1.0.0"