server:
  port: ${PORT:8080}
spring:
  application:
    name: open-connect
  threads:
    virtual:
      enabled: true
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:open_connect}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 4000
      pool-name: ChatPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
# CORS Configuration
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
# Security & Message Encryption Configuration
security:
  chat:
    encryption:
      secret-key: ${CHAT_ENCRYPTION_KEY:OpenConnectEngineSecretKey2026AES256GCM!}
# Room Lifecycle & Cleanup Scheduler Configuration
open-connect:
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}
    cron: "${CLEANUP_CRON:0 0 3 * * ?}"
    unclosed-ttl-hours: ${CLEANUP_UNCLOSED_TTL_HOURS:24}
    retention-days: ${CLEANUP_RETENTION_DAYS:15}
    max-batches: ${CLEANUP_MAX_BATCHES:10}
# Swagger Configuration
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH:logs/open-connect.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.pranit.connect: ${LOG_LEVEL:DEBUG}
    org.springframework.web.socket: INFO
    org.springframework.messaging: DEBUG
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/open-connect.log}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
# Actuator Configuration
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
      cors:
        allowed-origin-patterns: "*"
        allowed-methods:
          - GET
          - POST
          - OPTIONS
        allowed-headers: "*"
        allow-credentials: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
info:
  app:
    name: open-connect
    description: "open-connect backend engine."
    version: "1.0.0"
